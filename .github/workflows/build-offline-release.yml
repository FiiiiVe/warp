name: Warp Offline V0 - Windows Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    name: Build Windows Portable
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # 1. Checkout 你的 fork
      - name: Checkout fork
        uses: actions/checkout@v6

      # 2. 继续复用 Warp 官方 CI 已经验证成功的环境准备
      - name: Prepare Warp build environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: false

      # 3. 正式构建 warp-oss.exe
      #
      # 不构建 Inno Setup installer，因为我们的目标是 portable。
      # bundle.ps1 会自动使用：
      #   channel = oss
      #   profile = rlto
      #   target  = x86_64-pc-windows-msvc
      #   features = release_bundle,gui,nld_classifier_v3,nld_heuristic_v2
      - name: Build Warp OSS binary
        id: build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .\script\windows\bundle.ps1 `
            -CHANNEL oss `
            -ARCH x64 `
            -SKIP_BUILD_INSTALLER

          if ($LASTEXITCODE -ne 0) {
            throw "Warp binary build failed"
          }

      # 4. prepare_bundled_resources.ps1 需要 cargo-about。
      # 官方环境通常已有；没有则补装。
      - name: Ensure cargo-about
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-about -ErrorAction SilentlyContinue)) {
            Write-Host "cargo-about not found, installing..."
            cargo install --locked --features cli cargo-about

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install cargo-about"
            }
          }
          else {
            Write-Host "cargo-about already installed"
          }

      # 5. 生成官方 runtime resources：
      #    resources/bundled
      #    THIRD_PARTY_LICENSES.txt
      #    settings_schema.json
      - name: Prepare bundled resources
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $target = "${{ steps.build.outputs.target_profile_dir }}"
          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "script\windows\prepare_bundled_resources.ps1"

          Write-Host "Target profile dir: $target"

          # 不同 Warp revision 的脚本参数略有区别。
          # 自动判断当前 checkout 是否支持 CargoProfile。
          $command = Get-Command $script

          Write-Host "prepare_bundled_resources supported parameters:"
          Write-Host ($command.Parameters.Keys -join ", ")

          if ($command.Parameters.ContainsKey("CargoProfile")) {
            Write-Host "Using CargoProfile=rlto"

            & $script `
              -DestinationDir "$target\resources" `
              -Channel "oss" `
              -CargoProfile "rlto"
          }
          else {
            Write-Host "CargoProfile is not supported by this Warp revision."
            Write-Host "Calling the script with its native parameter set."

            & $script `
              -DestinationDir "$target\resources" `
              -Channel "oss"
          }

          if (-not $?) {
            throw "Preparing bundled resources failed"
          }

      # 6. 按官方 Windows installer 的 [Files] 布局
      #    手工组装 portable 目录。
      - name: Assemble portable directory
        shell: pwsh
        run: |
          $root   = $env:GITHUB_WORKSPACE
          $target = "${{ steps.build.outputs.target_profile_dir }}"
          $assets = Join-Path $root "app\assets\windows\x64"

          $dist = Join-Path $root "dist"
          $out  = Join-Path $dist "Warp-Offline-v0-win-x64"

          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $out -Force | Out-Null
          New-Item -ItemType Directory -Path "$out\x64" -Force | Out-Null

          Write-Host "Building portable layout at:"
          Write-Host $out

          # Warp binary
          Copy-Item "$target\warp-oss.exe" "$out\warp-oss.exe"

          # Windows Terminal / ConPTY runtime
          Copy-Item "$assets\conpty.dll" "$out\conpty.dll"
          Copy-Item "$assets\OpenConsole.exe" "$out\x64\OpenConsole.exe"

          # DirectX shader compiler
          Copy-Item "$assets\dxcompiler.dll" "$out\dxcompiler.dll"
          Copy-Item "$assets\dxil.dll" "$out\dxil.dll"

          # VC++ runtime
          Copy-Item "$assets\vcruntime140.dll" "$out\vcruntime140.dll"
          Copy-Item "$assets\vcruntime140_1.dll" "$out\vcruntime140_1.dll"
          Copy-Item "$assets\msvcp140.dll" "$out\msvcp140.dll"

          # PowerShell shell integration bootstrap
          Copy-Item `
            "$root\app\assets\bundled\bootstrap\pwsh.ps1" `
            "$out\pwsh.ps1"

          # OSS icon
          Copy-Item `
            "$root\app\channels\oss\icon\no-padding\icon.ico" `
            "$out\icon.ico"

          # Runtime resources
          Copy-Item `
            "$target\resources" `
            "$out\resources" `
            -Recurse

          # License
          if (Test-Path "$root\LICENSE-AGPL") {
            Copy-Item "$root\LICENSE-AGPL" "$out\LICENSE-AGPL"
          }

          if (Test-Path "$root\LICENSE-MIT") {
            Copy-Item "$root\LICENSE-MIT" "$out\LICENSE-MIT"
          }

          # Record exactly which source produced this build.
          @"
          Warp Offline V0

          Repository:
          ${{ github.repository }}

          Commit:
          ${{ github.sha }}

          Branch:
          ${{ github.ref_name }}

          Build:
          GitHub Actions

          Target:
          x86_64-pc-windows-msvc

          Channel:
          oss

          Cargo profile:
          rlto

          Offline V0:
          First-run offline login gate allows the existing
          loginless / SkippedLogin flow.

          Built at:
          $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          "@ | Set-Content "$out\BUILD-INFO.txt" -Encoding UTF8

          Write-Host ""
          Write-Host "Portable directory:"
          Get-ChildItem $out
          Write-Host ""
          Write-Host "x64:"
          Get-ChildItem "$out\x64"

      # 7. 在上传之前做硬校验。
      #    缺一个 runtime 文件就直接让 Action 失败。
      - name: Verify portable layout
        shell: pwsh
        run: |
          $out = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist\Warp-Offline-v0-win-x64"

          $required = @(
            "warp-oss.exe",
            "conpty.dll",
            "dxcompiler.dll",
            "dxil.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "pwsh.ps1",
            "icon.ico",
            "x64\OpenConsole.exe",
            "resources",
            "resources\THIRD_PARTY_LICENSES.txt",
            "resources\settings_schema.json",
            "BUILD-INFO.txt"
          )

          foreach ($item in $required) {
            $path = Join-Path $out $item

            if (-not (Test-Path $path)) {
              throw "Required portable file missing: $item"
            }

            Write-Host "OK  $item"
          }

          Write-Host ""
          Write-Host "Portable layout verification passed."

      # 8. 给你看一下最终大小
      - name: Show portable size
        shell: pwsh
        run: |
          $out = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist\Warp-Offline-v0-win-x64"

          $size = (
            Get-ChildItem $out -Recurse -File |
            Measure-Object Length -Sum
          ).Sum

          $sizeMB = [math]::Round($size / 1MB, 2)

          Write-Host "Portable package size: $sizeMB MB"

      # 9. GitHub 会自动把这个目录作为 ZIP Artifact 下载
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warp-Offline-v0-win-x64
          path: dist/Warp-Offline-v0-win-x64
          retention-days: 1
          if-no-files-found: error
